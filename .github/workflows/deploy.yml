name: Deploy Staging Environment

on:
  push:
    branches: [stage]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE: bathremodelhub-frontend-stage
  IMAGE: bathremodelhub-frontend-stage
  DOMAIN: stage.bathremodelhub.us

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$GCP_SA_KEY" > /tmp/gcp-key.json
          gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
          gcloud config set project $PROJECT_ID
          rm /tmp/gcp-key.json

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install gcloud beta component
        run: gcloud components install beta --quiet

      - name: Build Docker image
        run: |
          gcloud builds submit . \
            --tag gcr.io/$PROJECT_ID/$IMAGE \
            --project $PROJECT_ID

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image gcr.io/$PROJECT_ID/$IMAGE \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --port 8080 \
            --clear-secrets \
            --set-env-vars "NODE_ENV=staging,API_BASE_URL=${{ secrets.API_BASE_URL }},TOKEN_URL=${{ secrets.TOKEN_URL }},CLIENT_ID=${{ secrets.CLIENT_ID }},CLIENT_SECRET=${{ secrets.CLIENT_SECRET }}" \
            --project $PROJECT_ID

      - name: Map custom domain
        run: |
          if ! gcloud beta run domain-mappings describe \
              --domain $DOMAIN \
              --region $REGION \
              --project $PROJECT_ID 2>/dev/null; then
            gcloud beta run domain-mappings create \
              --service $SERVICE \
              --domain $DOMAIN \
              --region $REGION \
              --project $PROJECT_ID
          else
            echo "Domain mapping for $DOMAIN already exists. Skipping."
          fi

      - name: Print DNS records
        run: |
          echo "========================================"
          echo "  DNS records required at your registrar"
          echo "========================================"
          gcloud beta run domain-mappings describe \
            --domain $DOMAIN \
            --region $REGION \
            --project $PROJECT_ID \
            --format="table(status.resourceRecords[].name, status.resourceRecords[].type, status.resourceRecords[].rrdata)"
